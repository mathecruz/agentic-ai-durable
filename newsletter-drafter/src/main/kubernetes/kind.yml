apiVersion: v1
kind: ConfigMap
metadata:
  name: infra-config
data:
  QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://postgres.default.svc.cluster.local:5432/newsletter"
  MP_MESSAGING_CONNECTOR_SMALLRYE_KAFKA_BOOTSTRAP_SERVERS: "PLAIN_TEXT://kafka.default.svc.cluster.local:9092"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: newsletter-drafter
spec:
  strategy:
    type: Recreate
  template:
     spec:
       containers:
         - name: newsletter-drafter