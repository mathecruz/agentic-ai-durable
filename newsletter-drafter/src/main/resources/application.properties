quarkus.langchain4j.log-responses=true
quarkus.langchain4j.log-requests=true
#quarkus.langchain4j.timeout=60000
# OpenAI
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY}
# Kafka
quarkus.flow.messaging.defaults-enabled=true
# Flow Engine Inbound CloudEvents (binary mode: data as payload, attributes as ce_* headers)
mp.messaging.incoming.flow-in.connector=smallrye-kafka
mp.messaging.incoming.flow-in.topic=flow-in
mp.messaging.incoming.flow-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.flow-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Flow Engine Outbound CloudEvents (binary mode: data as payload, attributes as ce_* headers)
mp.messaging.outgoing.flow-out.connector=smallrye-kafka
mp.messaging.outgoing.flow-out.topic=flow-out
mp.messaging.outgoing.flow-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.flow-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
# Flow Engine lifecycle events (useful for telemetry/auditing)
quarkus.flow.messaging.lifecycle-enabled=true
mp.messaging.outgoing.flow-lifecycle-out.connector=smallrye-kafka
mp.messaging.outgoing.flow-lifecycle-out.topic=flow-lifecycle-out
mp.messaging.outgoing.flow-lifecycle-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.flow-lifecycle-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
# Outgoing channel used by the Newsletter API resource
mp.messaging.outgoing.flow-in-outgoing.connector=smallrye-kafka
mp.messaging.outgoing.flow-in-outgoing.topic=flow-in
mp.messaging.outgoing.flow-in-outgoing.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.flow-in-outgoing.key.serializer=org.apache.kafka.common.serialization.StringSerializer
# Kafka consumer for flow-out -> Newsletter WebSocket bridge
mp.messaging.incoming.flow-out-incoming.connector=smallrye-kafka
mp.messaging.incoming.flow-out-incoming.topic=flow-out
mp.messaging.incoming.flow-out-incoming.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.flow-out-incoming.auto.offset.reset=earliest
mp.messaging.incoming.flow-out-incoming.group.id=newsletter-ws-bridge-${HOSTNAME}
# Kafka consumer for flow-lifecycle-out -> workflow progress on the WebSocket and the newsletter read model
mp.messaging.incoming.flow-lifecycle-incoming.connector=smallrye-kafka
mp.messaging.incoming.flow-lifecycle-incoming.topic=flow-lifecycle-out
mp.messaging.incoming.flow-lifecycle-incoming.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.flow-lifecycle-incoming.auto.offset.reset=latest
mp.messaging.incoming.flow-lifecycle-incoming.group.id=newsletter-lifecycle-bridge-${HOSTNAME}
quarkus.http.port=8080
quarkus.log.category."io.quarkiverse.flow".level=INFO
quarkus.log.category."io.quarkiverse.flow.persistence".level=DEBUG
quarkus.flow.tracing.enabled=true
quarkus.flow.durable.kube.pool.name=newsletter-drafter

# Database (PostgreSQL) - schema managed by quarkus-flow-db-migration
# https://docs.quarkiverse.io/quarkus-flow/dev/db-migration.html
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.datasource.db-kind=postgresql
# Named "flow-runtime" datasource: only an isolated Flyway history/location, pointing at the
# same database as the default datasource (Dev Services runs on the default datasource only)
quarkus.datasource.flow-runtime.db-kind=postgresql
quarkus.datasource.flow-runtime.devservices.enabled=false
quarkus.datasource.flow-runtime.jdbc.url=${quarkus.datasource.jdbc.url}
quarkus.datasource.flow-runtime.username=${quarkus.datasource.username}
quarkus.datasource.flow-runtime.password=${quarkus.datasource.password}
quarkus.flyway.flow-runtime.table=flyway_flow_runtime_history
quarkus.flyway.flow-runtime.migrate-at-start=true
quarkus.flyway.flow-runtime.locations=db/flow-migration/runtime/postgresql
# Application schema (newsletter read model), migrated from the default location db/migration.
# The schema is not empty when the Flow migration runs first, hence the baseline below the first script.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0

